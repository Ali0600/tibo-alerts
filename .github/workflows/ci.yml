name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:mutations
      - run: npm audit --audit-level=moderate
      - run: npm run build:node
      - run: npm run verify:bundle
      - run: npm run build
      - run: npm run verify:hosted
      - id: keys
        run: npm run keys -- --write
      - name: Build and start isolated SQLite app
        run: docker compose up --build --wait --wait-timeout=90 app
      - name: Verify database and closed launch gates
        run: node scripts/smoke-http.mjs http://localhost:3000
      - name: Verify persistent restart
        run: |
          node scripts/with-env.mjs node scripts/persistence-smoke.mjs write http://localhost:3000
          docker compose up --force-recreate --wait --wait-timeout=90 app
          node scripts/persistence-smoke.mjs verify http://localhost:3000
          node scripts/smoke-http.mjs http://localhost:3000
      - name: Build isolated source worker (includes no-network import check)
        run: docker compose --profile worker build worker
      - name: Stop test containers
        if: always() && steps.keys.outcome == 'success'
        run: docker compose down --volumes
